<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>simpleMap</title>
<script
	src="https://apis.openapi.sk.com/tmap/vectorjs?version=1&appKey=발급받은 Appkey"></script>
<script type="text/javascript">
	var map;
	var lonlat;
	// 페이지가 로딩이 된 후 호출하는 함수입니다.
	function initTmap(){
		// map 생성
		// Tmapv3.Map을 이용하여, 지도가 들어갈 div, 넓이, 높이를 설정합니다.
		map = new Tmapv3.Map("map_div", {
			center : new Tmapv3.LatLng(37.56259379, 126.99243652),
			width : "100%",	// 지도의 넓이
			height : "400px",	// 지도의 높이
			zoom : 16	// 지도 줌레벨
		});
	}        
	//처음위치로 이동하는 함수입니다.
	function Move(){
	 	var lonlat = new Tmapv3.LatLng(37.56259379, 126.99243652);
		map.setCenter(lonlat); // 지도의 중심 좌표를 설정합니다.
	}
</script>
</head>
<body onload="initTmap()"><!-- 맵 생성 실행 -->
	<div id="map_div"></div>
	<button onClick="Move()">처음 위치로 지도 이동</button>
</body>
</html>
