<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>simpleMap</title>
<script
	src="https://apis.openapi.sk.com/tmap/vectorjs?version=1&appKey=" + appkey></script>
<script type="text/javascript">
	var map;
	//지도 초기화
	function initTmap(){
		map = new Tmapv3.Map("map_div", {
			center : new Tmapv3.LatLng(127.3848616, 36.3506295),
			width : "100%",	
			height : "400px",	
			zoom : 16	
		});
	}

		map.on("ConfigLoad", function() {
		        addCircle();
		        addPolyline();
		        addRectangle();
		        addPolygon();
		    });
	}
	
	//원
	function addCircle(){
		var circle = new Tmapv3.Circle({
			center: new Tmapv3.LatLng(127.3848616, 36.3506295),
			radius: 50,
			strokeWeight :1,
			fillColor: "#F7FF00",
			map: map
		});
	}
	
	//선
	function addPolyline(){
		var polyline = new Tmapv3.Polyline({
			path: [new Tmapv3.LatLng(127.3848616, 36.3506295),	// 선의 꼭짓점 좌표
				new Tmapv3.LatLng(127.3848616, 36.3506295),	// 선의 꼭짓점 좌표
				new Tmapv3.LatLng(127.3848616, 36.3506295),	// 선의 꼭짓점 좌표
				new Tmapv3.LatLng(127.3848616, 36.3506295),	// 선의 꼭짓점 좌표
				new Tmapv3.LatLng(127.3848616, 36.3506295)],
			strokeColor: "#dd00dd",
			strokeWeight: 6,
			 map: map
		});
	}
	
	//사각형
	function addRectangle(){
		var rect = new Tmapv3.Rectangle({
		bounds: new Tmapv3.LatLngBounds(new Tmapv3.LatLng(127.3848616, 36.3506295), new Tmapv3.LatLng(127.3848616, 36.3506295)),
		fillColor: "#037D2C",
		strokeWeight :1,
		map: map
		});
	}
	
	//다각형
	function addPolygon(){
		var polygon = new Tmapv3.Polygon({
			paths: [new Tmapv3.LatLng(127.3848616, 36.3506295),
			new Tmapv3.LatLng(127.3848616, 36.3506295),
			new Tmapv3.LatLng(127.3848616, 36.3506295),
			new Tmapv3.LatLng(127.3848616, 36.3506295),
			new Tmapv3.LatLng(127.3848616, 36.3506295)],
		fillColor:"#DE27D8",
		strokeWeight: 1,
		map: map
		});
	}
</script>
</head>
<body onload="initTmap()"><!-- 맵 생성 실행 -->
	<div id="map_div"></div>
</body>
</html>
